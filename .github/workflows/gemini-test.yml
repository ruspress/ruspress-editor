name: Gemini Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from google import genai

          client = genai.Client()

          response = client.models.generate_content(
              model="gemini-3.8-flash",
              contents="Напиши короткую тестовую новость для ИА «Российская пресса» о запуске автоматизированной редакции. Не выдумывай факты. Используй профессиональный журналистский стиль."
          )

          print(response.text)
          PY
