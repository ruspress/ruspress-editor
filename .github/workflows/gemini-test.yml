name: Gemini Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from google import genai
          from google.genai import errors

          client = genai.Client()

          models = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite"
          ]

          for model in models:
              print(f"Testing: {model}")

              try:
                  response = client.models.generate_content(
                      model=model,
                      contents="Напиши короткое сообщение об успешном техническом тестировании ИИ-редактора. Не добавляй неподтвержденных фактов."
                  )

                  if response.text:
                      print(f"SUCCESS: {model}")
                      print(response.text)
                      break

              except errors.APIError as e:
                  print(f"ERROR: {model}: {e.code}")
                  if e.code not in (404, 429, 500, 502, 503, 504):
                      raise

          else:
              raise SystemExit("No working model found")
          PY
