name: RusPress News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruspress-editor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install feedparser requests google-genai groq trafilatura

      - name: Check Python syntax
        run: |
          python -m py_compile news.py publish.py

      - name: Collect news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -u news.py

      - name: Editorial verification
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PUBLISH_ENABLED: "false"
        run: python -u publish.py

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: ruspress-reviewed
          path: |
            drafts.json
            approved.json
          retention-days: 7
