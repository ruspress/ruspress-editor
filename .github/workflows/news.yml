name: RusPress News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruspress-editor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install feedparser requests google-genai groq

      - name: Check Python syntax
        run: python -m py_compile news.py

      - name: Collect news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -u news.py

      - name: Save drafts
        uses: actions/upload-artifact@v4
        with:
          name: ruspress-drafts
          path: drafts.json
          retention-days: 7
