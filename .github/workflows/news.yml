name: RusPress News

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser google-genai

      - name: Collect news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news.py

      - name: Save drafts
        if: ${{ hashFiles('drafts.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ruspress-drafts
          path: drafts.json
