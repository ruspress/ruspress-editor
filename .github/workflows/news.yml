name: RusPress News

on:
  schedule:
    - cron: '0,30 4 * * *'
    - cron: '*/15 5-19 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: "Режим редакции"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - single
          - auto

permissions:
  contents: write

concurrency:
  group: ruspress-editor
  cancel-in-progress: false

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install feedparser requests google-genai groq trafilatura pillow lxml

      - name: Configure Git
        run: |
          git config user.name "RusPress Editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check Python syntax
        run: |
          python -m py_compile news.py publish.py editor.py telegram_source.py

      - name: Run editorial system
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          export EDITOR_MODE=test

          if [ "$AUTO_PUBLISH" = "true" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              export EDITOR_MODE=auto
            elif [ "$REQUESTED_MODE" = "auto" ]; then
              export EDITOR_MODE=auto
            elif [ "$REQUESTED_MODE" = "single" ]; then
              export EDITOR_MODE=single
            fi
          fi

          echo "AUTO_PUBLISH=$AUTO_PUBLISH"
          echo "EDITOR_MODE=$EDITOR_MODE"

          python -u editor.py

      - name: Save editorial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruspress-editor-results
          path: |
            drafts.json
            approved.json
            rejected.json
            published.json
            queue.json
            news-card.jpg
          retention-days: 3
